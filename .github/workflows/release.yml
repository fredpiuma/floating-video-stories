name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  zip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Conferir que a versão do código é a da tag
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          WANTED="${TAG#v}"
          HEADER="$(sed -n 's/^[ *]*Version: *//p' fred-video-produto.php | head -1 | tr -d '\r ')"
          echo "tag=$WANTED cabeçalho=$HEADER"
          for v in "$HEADER"; do
            [ "$v" = "$WANTED" ] || { echo "A versão da tag ($WANTED) não bate com a do código ($v)." >&2; exit 1; }
          done

      - name: Gerar o zip
        run: tools/build-zip.sh

      - name: Conferir o conteúdo do zip
        run: |
          unzip -Z1 dist/floating-video-stories.zip > lista.txt
          if grep -v '^floating-video-stories/' lista.txt | grep -q .; then
            echo "O zip tem arquivos fora da pasta floating-video-stories/" >&2; exit 1
          fi
          if grep -E '^floating-video-stories/(\.github/|tools/|docs/|CLAUDE\.md|AGENTS\.md|GEMINI\.md|README\.md|CHANGELOG\.md)' lista.txt; then
            echo "O zip tem arquivos de desenvolvimento" >&2; exit 1
          fi
          grep -q '^floating-video-stories/fred-video-produto.php$' lista.txt

      - name: Anexar os zips ao release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" dist/floating-video-stories.zip dist/floating-video-stories-*.zip --clobber
